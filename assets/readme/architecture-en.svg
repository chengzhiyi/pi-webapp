<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1400" height="1120" viewBox="0 0 1400 1120" role="img" aria-labelledby="title desc">
  <title id="title">One workbench. A complete Agent workflow.</title>
  <desc id="desc">Browser and Electron share a React workbench. HTTP actions and NDJSON events connect it to a local Node host, which orchestrates Pi sessions and plugins. Pi SDK, model providers and local tools supply execution. Contracts, optional hosted extensions and diagnostics are shown alongside the main layers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9Z" fill="#7b8fa1"/></marker>
  </defs>
  <rect width="1400" height="1120" rx="16" fill="#ffffff"/>
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" stroke-linejoin="round" stroke-linecap="round">
    <text x="60" y="54" font-size="16" fill="#64748b" font-weight="600" text-anchor="start">SYSTEM ARCHITECTURE / PI WEBAPP</text>
    <text x="60" y="110" font-size="36" fill="#0f172a" font-weight="700" text-anchor="start">One workbench. A complete Agent workflow.</text>
    <text x="60" y="150" font-size="18" fill="#64748b" font-weight="400" text-anchor="start">Shared UI · Local-first host · Typed contracts · Pluggable capabilities</text>
    <rect x="60" y="190" width="1000" height="180" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="84" y="234" font-size="20" fill="#334155" font-weight="600" text-anchor="start">01  Interaction layer</text>
    <text x="1036" y="234" font-size="15" fill="#64748b" font-weight="400" text-anchor="end">web/src/ui · src/host/client</text>
    <g id="entry" data-card="true">
    <rect x="84" y="262" width="190" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="179" y="294" font-size="17" fill="#334155" font-weight="600" text-anchor="middle">Browser / Electron</text>
    <text x="179" y="318" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">One React interface</text>
    </g>
    <g id="workbench" data-card="true">
    <rect x="298" y="262" width="464" height="76" rx="12" fill="#eaf2f9" stroke="#93b5d4" stroke-width="1.5"/>
    <text x="530" y="294" font-size="18" fill="#334155" font-weight="600" text-anchor="middle">React + TypeScript workbench</text>
    <text x="530" y="318" font-size="18" fill="#334155" font-weight="400" text-anchor="middle">Chat · Sessions · Dock panels · Settings</text>
    </g>
    <g id="plugin-ui" data-card="true">
    <rect x="786" y="262" width="250" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="911" y="294" font-size="16" fill="#334155" font-weight="600" text-anchor="middle">Plugin views</text>
    <text x="911" y="318" font-size="16" fill="#334155" font-weight="400" text-anchor="middle">Built-in panels / Extension UI</text>
    </g>
    <g id="transport" data-card="true">
    <rect x="60" y="418" width="1000" height="74" rx="12" fill="#eef4f8" stroke="#a8bdce" stroke-width="1.5"/>
    <text x="560" y="461" font-size="19" fill="#334155" font-weight="600" text-anchor="middle">Transport     HTTP actions / NDJSON events · Bearer + Origin checks</text>
    </g>
    <rect x="60" y="540" width="1000" height="228" rx="12" fill="#f5f3f9" stroke="#b8b0d1" stroke-width="1.5"/>
    <text x="84" y="584" font-size="20" fill="#504565" font-weight="600" text-anchor="start">02  Local Node host</text>
    <text x="1036" y="584" font-size="15" fill="#776e89" font-weight="400" text-anchor="end">src/host/server</text>
    <g id="orchestration" data-card="true">
    <rect x="84" y="610" width="440" height="82" rx="12" fill="#ffffff" stroke="#b8b0d1" stroke-width="1.5"/>
    <text x="304" y="645" font-size="17" fill="#334155" font-weight="600" text-anchor="middle">Application orchestration &amp; lifecycle</text>
    <text x="304" y="669" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">Sessions / Workspaces / Model auth / Attachments</text>
    </g>
    <g id="plugin-registry" data-card="true">
    <rect x="548" y="610" width="488" height="82" rx="12" fill="#ebe7f4" stroke="#b8b0d1" stroke-width="1.5"/>
    <text x="792" y="645" font-size="17" fill="#334155" font-weight="600" text-anchor="middle">Plugin registration &amp; runtime management</text>
    <text x="792" y="669" font-size="17" fill="#334155" font-weight="400" text-anchor="middle">Files · Git · Terminal / Hosted extensions</text>
    </g>
    <text x="84" y="738" font-size="16" fill="#776e89" font-weight="400" text-anchor="start">Thin Pi adapter · Foreground / background sessions · Plugin switches &amp; cleanup</text>
    <rect x="60" y="816" width="1000" height="156" rx="12" fill="#f1f7f4" stroke="#abc4b7" stroke-width="1.5"/>
    <text x="84" y="860" font-size="20" fill="#365c4a" font-weight="600" text-anchor="start">03  Execution &amp; external capabilities</text>
    <g id="pi-runtime" data-card="true">
    <rect x="84" y="884" width="292" height="62" rx="12" fill="#ffffff" stroke="#abc4b7" stroke-width="1.5"/>
    <text x="230" y="921" font-size="18" fill="#334155" font-weight="600" text-anchor="middle">Pi SDK · AgentSession</text>
    </g>
    <g id="model-providers" data-card="true">
    <rect x="400" y="884" width="288" height="62" rx="12" fill="#ffffff" stroke="#abc4b7" stroke-width="1.5"/>
    <text x="544" y="921" font-size="18" fill="#334155" font-weight="600" text-anchor="middle">Model providers · APIs</text>
    </g>
    <g id="local-tools" data-card="true">
    <rect x="712" y="884" width="324" height="62" rx="12" fill="#ffffff" stroke="#abc4b7" stroke-width="1.5"/>
    <text x="874" y="921" font-size="17" fill="#334155" font-weight="600" text-anchor="middle">Filesystem · Git · PTY / Processes</text>
    </g>
    <g id="contracts" data-card="true">
    <rect x="1092" y="190" width="248" height="302" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="1116" y="232" font-size="20" fill="#475569" font-weight="600" text-anchor="start">Typed contracts</text>
    <text x="1116" y="284" font-size="16" fill="#475569" font-weight="400" text-anchor="start">Wire DTOs</text>
    <text x="1116" y="309" font-size="16" fill="#475569" font-weight="400" text-anchor="start">Event validation</text>
    <text x="1116" y="334" font-size="16" fill="#475569" font-weight="400" text-anchor="start">Plugin / Workbench API</text>
    <text x="1116" y="384" font-size="16" fill="#475569" font-weight="400" text-anchor="start">Browser code never imports</text>
    <text x="1116" y="409" font-size="16" fill="#475569" font-weight="400" text-anchor="start">Node / Pi runtime objects</text>
    <text x="1116" y="476" font-size="15" fill="#64748b" font-weight="400" text-anchor="start">src/contracts</text>
    </g>
    <g id="extensions" data-card="true">
    <rect x="1092" y="540" width="248" height="228" rx="12" fill="#faf7f1" stroke="#c5bba9" stroke-width="1.5"/>
    <text x="1116" y="582" font-size="20" fill="#756044" font-weight="600" text-anchor="start">Optional extensions</text>
    <text x="1116" y="634" font-size="16" fill="#756044" font-weight="400" text-anchor="start">Hosted plugin runtime</text>
    <text x="1116" y="659" font-size="16" fill="#756044" font-weight="400" text-anchor="start">Separate Node process</text>
    <text x="1116" y="709" font-size="16" fill="#756044" font-weight="400" text-anchor="start">Official Excalidraw plugin</text>
    <text x="1116" y="734" font-size="16" fill="#756044" font-weight="400" text-anchor="start">Opt-in, not built in</text>
    </g>
    <g id="support" data-card="true">
    <rect x="1092" y="816" width="248" height="156" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="1116" y="858" font-size="20" fill="#475569" font-weight="600" text-anchor="start">Cross-cutting support</text>
    <text x="1116" y="910" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Sentry · Diagnostics</text>
    <text x="1116" y="935" font-size="14" fill="#475569" font-weight="400" text-anchor="start">CLI / Desktop launch &amp; updates</text>
    </g>
    <path d="M560 373 V411" fill="none" stroke="#7b8fa1" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M560 495 V533" fill="none" stroke="#7b8fa1" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M560 771 V809" fill="none" stroke="#7b8fa1" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M60 1014 H1340" fill="none" stroke="#e2e8f0"/>
    <text x="60" y="1058" font-size="16" fill="#64748b" font-weight="400" text-anchor="start">A local modular host, not a microservice cluster. Peers within a layer do not imply sequential calls.</text>
    <text x="60" y="1090" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">Source: src/host · src/plugins/builtin · src/contracts · web · desktop</text>
  </g>
</svg>

name: CI and npm publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test

  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: pi-webapp-npm-publish
      queue: max
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Choose the next patch version
        run: node scripts/prepare-release.mjs
      - run: npm publish

name: CI and npm publish

on:
  pull_request:
    branches: [main, alpha]
  push:
    branches: [main, alpha]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only superseded PR checks may be cancelled; branch/release runs stay unique.
    concurrency:
      group: ${{ github.workflow }}-core-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      protocol_published: ${{ steps.protocol.outputs.published }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Check protocol publication
        id: protocol
        run: node scripts/sync-protocol-dependency.mjs --probe
      - name: Check out protocol source for initial verification
        if: steps.protocol.outputs.published == 'false'
        uses: actions/checkout@v6
        with:
          repository: chengzhiyi/pi-extensions
          ref: e719070a1d407319841a9a23287e402265a63b8a
          path: .ci/pi-extensions
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        if: steps.protocol.outputs.published == 'false'
        with:
          package_json_file: .ci/pi-extensions/package.json
      - name: Build the protocol from the pinned source
        if: steps.protocol.outputs.published == 'false'
        working-directory: .ci/pi-extensions
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @chengzhiyi/pi-web-protocol build
      - name: Resolve the protocol dependency for verification
        run: node scripts/sync-protocol-dependency.mjs --source .ci/pi-extensions/packages/protocol
      - run: npm ci
      - name: Fetch integrity-pinned published plugin fixtures
        run: node scripts/prepare-hosted-ci-fixtures.mjs
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Verify rewritten alpha host in an isolated release candidate
        run: node scripts/test-release-host.mjs

  browser:
    strategy:
      fail-fast: false
      matrix:
        group: [general, hosted]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-browser-${{ matrix.group }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      PI_WEB_BROWSER_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      # Match core verification's pinned protocol, including the bootstrap path.
      - name: Check protocol publication
        id: protocol
        run: node scripts/sync-protocol-dependency.mjs --probe
      - name: Check out protocol source for initial verification
        if: steps.protocol.outputs.published == 'false'
        uses: actions/checkout@v6
        with:
          repository: chengzhiyi/pi-extensions
          ref: e719070a1d407319841a9a23287e402265a63b8a
          path: .ci/pi-extensions
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        if: steps.protocol.outputs.published == 'false'
        with:
          package_json_file: .ci/pi-extensions/package.json
      - name: Build the protocol from the pinned source
        if: steps.protocol.outputs.published == 'false'
        working-directory: .ci/pi-extensions
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @chengzhiyi/pi-web-protocol build
      - name: Resolve the protocol dependency for verification
        run: node scripts/sync-protocol-dependency.mjs --source .ci/pi-extensions/packages/protocol
      - run: npm ci
      - name: Fetch integrity-pinned published plugin fixtures
        run: node scripts/prepare-hosted-ci-fixtures.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Disjoint file groups in isolated runners, each retaining a single worker.
      - name: Run browser group once and retain its report
        id: browser
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: .ci/browser/report.json
        run: npx playwright test --config=playwright.ci.config.ts --reporter=line,json
      - name: Require clean hosted lifecycle from that same report
        if: always() && matrix.group == 'hosted' && steps.browser.outcome != 'skipped' && steps.browser.outcome != 'cancelled'
        run: node scripts/verify-hosted-browser-results.mjs .ci/browser/report.json
      - name: Verify real public cross-version plugin update
        if: matrix.group == 'hosted'
        env:
          HOSTED_NPM_UPGRADE_FROM: '0.1.0'
        run: npx playwright test hosted-npm --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ matrix.group }}
          path: |
            .ci/browser
            test-results
          if-no-files-found: ignore

  # Keep the existing required check name; no failed/skipped/cancelled group may
  # turn green merely because an upstream job did not run.
  verify:
    if: always()
    needs: [verify-core, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      protocol_published: ${{ needs.verify-core.outputs.protocol_published }}
    steps:
      - name: Require every verification group to succeed
        env:
          CORE_RESULT: ${{ needs.verify-core.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$CORE_RESULT" = success
          test "$BROWSER_RESULT" = success

  platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ${{ github.workflow }}-smoke-${{ matrix.os }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      # These tests use only Node's built-ins and can run before npm ci.
      - run: node --experimental-strip-types --test test/npm-command.test.ts test/self-update.test.ts test/open-web-page.test.ts test/release-channels.test.ts test/release-plan.test.ts

  publish:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/alpha') && needs.verify.outputs.protocol_published == 'true'
    needs: [verify, platform-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pi-webapp-npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Never replace the verified source with a newer branch tip.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11
      - name: Resolve the published protocol dependency
        run: node scripts/sync-protocol-dependency.mjs
      - name: Fetch integrity-pinned published plugin fixtures
        run: node scripts/prepare-hosted-ci-fixtures.mjs
      - run: npm ci
      - name: Choose the next version and npm distribution tag
        run: node scripts/prepare-release.mjs
      - run: npm run check
      # The integration tests serve web/dist; this local build does not upload.
      - run: npm run build
      - run: npm test
      - name: Build and upload exact release source maps
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || 'soft' }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || 'pi-webapp' }}
          SENTRY_NODE_PROJECT: ${{ vars.SENTRY_NODE_PROJECT }}
          SENTRY_BROWSER_PROJECT: ${{ vars.SENTRY_BROWSER_PROJECT }}
          SENTRY_URL: ${{ vars.SENTRY_URL || 'https://us.sentry.io/' }}
        run: npm run build:sentry
      - name: Pack uploaded artifacts without rebuilding
        run: |
          mkdir -p .ci/release
          npm pack --ignore-scripts --json --pack-destination .ci/release > .ci/release/pack.json
          npm run verify:package -- --pack-manifest .ci/release/pack.json
      - run: npx playwright install --with-deps chromium
      - name: Verify real Node and browser source resolution
        env:
          SENTRY_VERIFY_AUTH_TOKEN: ${{ secrets.SENTRY_VERIFY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || 'soft' }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || 'pi-webapp' }}
          SENTRY_NODE_PROJECT: ${{ vars.SENTRY_NODE_PROJECT }}
          SENTRY_BROWSER_PROJECT: ${{ vars.SENTRY_BROWSER_PROJECT }}
          SENTRY_URL: ${{ vars.SENTRY_URL || 'https://us.sentry.io/' }}
          PI_WEB_SENTRY_NODE_DSN: ${{ vars.PI_WEB_SENTRY_NODE_DSN || 'https://070c0b7c5ac18d940c294e63ecfa0793@o4506663318716416.ingest.us.sentry.io/4512191040716800' }}
          PI_WEB_SENTRY_BROWSER_DSN: ${{ vars.PI_WEB_SENTRY_BROWSER_DSN || 'https://070c0b7c5ac18d940c294e63ecfa0793@o4506663318716416.ingest.us.sentry.io/4512191040716800' }}
        run: npm run verify:sentry -- --pack-manifest .ci/release/pack.json
      # Version changes belong only to this verified artifact. Do not race branch
      # pushes or create version-only merge conflicts between alpha and main.
      - name: Publish the verified tarball without lifecycle rebuilds
        run: node scripts/publish-verified-release.mjs

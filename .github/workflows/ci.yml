name: CI and npm publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      protocol_published: ${{ steps.protocol.outputs.published }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Check protocol publication
        id: protocol
        run: node scripts/sync-protocol-dependency.mjs --probe
      - name: Check out protocol source for initial verification
        if: steps.protocol.outputs.published == 'false'
        uses: actions/checkout@v6
        with:
          repository: chengzhiyi/pi-extensions
          ref: e719070a1d407319841a9a23287e402265a63b8a
          path: .ci/pi-extensions
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        if: steps.protocol.outputs.published == 'false'
        with:
          package_json_file: .ci/pi-extensions/package.json
      - name: Build the protocol from the pinned source
        if: steps.protocol.outputs.published == 'false'
        working-directory: .ci/pi-extensions
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @chengzhiyi/pi-web-protocol build
      - name: Resolve the protocol dependency for verification
        run: node scripts/sync-protocol-dependency.mjs --source .ci/pi-extensions/packages/protocol
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test

  platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      # These tests use only Node's built-ins and can run before npm ci.
      - run: node --experimental-strip-types --test test/npm-command.test.ts test/self-update.test.ts test/open-web-page.test.ts

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.verify.outputs.protocol_published == 'true'
    needs: [verify, platform-smoke]
    runs-on: ubuntu-latest
    concurrency:
      group: pi-webapp-npm-publish
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11
      - name: Resolve the published protocol dependency
        run: node scripts/sync-protocol-dependency.mjs
      - run: npm ci
      - name: Choose the next patch version
        run: node scripts/prepare-release.mjs
      - name: Sync the release version to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync release version [skip ci]"
            git push origin HEAD:main
          fi
      - run: npm publish

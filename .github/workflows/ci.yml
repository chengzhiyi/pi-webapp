name: CI and npm publish

on:
  pull_request:
    branches: [main, alpha]
  push:
    branches: [main, alpha]
    # A push that only changes the documentation site must not publish the package.
    # docs.yml builds and checks those changes; mixed pushes still run everything.
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # PRs that only touch the docs site skip the suites; verify still reports a
  # result. Push runs already ignore docs-only changes through paths-ignore.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Detect docs-only pull requests
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then echo code=true >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -Ev '^(docs/|\.github/workflows/docs\.yml$)' > /dev/null; then
            echo code=false >> "$GITHUB_OUTPUT"
          else
            echo code=true >> "$GITHUB_OUTPUT"
          fi

  verify-core:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The release Chrome preflight must match the publish runner, not a container.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Only superseded PR checks may be cancelled; branch/release runs stay unique.
    concurrency:
      group: ${{ github.workflow }}-core-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      protocol_published: ${{ steps.protocol.outputs.published }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Check protocol publication
        id: protocol
        run: node scripts/sync-protocol-dependency.mjs --probe
      - name: Check out protocol source for initial verification
        if: steps.protocol.outputs.published == 'false'
        uses: actions/checkout@v7
        with:
          repository: chengzhiyi/pi-extensions
          ref: e719070a1d407319841a9a23287e402265a63b8a
          path: .ci/pi-extensions
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        if: steps.protocol.outputs.published == 'false'
        with:
          package_json_file: .ci/pi-extensions/package.json
      - name: Build the protocol from the pinned source
        if: steps.protocol.outputs.published == 'false'
        working-directory: .ci/pi-extensions
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @chengzhiyi/pi-web-protocol build
      - name: Resolve the protocol dependency for verification
        run: node scripts/sync-protocol-dependency.mjs --source .ci/pi-extensions/packages/protocol
      # Normally ~20s; fail fast on a registry hang instead of holding the job.
      - run: npm ci
        timeout-minutes: 5
      - name: Fetch integrity-pinned published plugin fixtures
        timeout-minutes: 3
        run: node scripts/prepare-hosted-ci-fixtures.mjs
      - name: Verify the runner Chrome used by release probes
        timeout-minutes: 1
        run: node scripts/verify-ci-chrome.mjs
      - run: npm run lint -- --reporter=github
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Verify actual bootstrap with an alpha host identity
        run: |
          original=$(mktemp)
          cp package.json "$original"
          trap 'cp "$original" package.json; rm -f "$original"' EXIT
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json","utf8")); p.version="0.1.31-alpha.5"; fs.writeFileSync("package.json", JSON.stringify(p,null,2)+"\n");'
          node --import ./test/setup-env.mjs --experimental-strip-types --test test/auto-open.test.ts test/extension-flow.test.ts test/hosted-bootstrap.test.ts

  browser:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # The ~3 minute stress measurement gates main/alpha pushes (and therefore
        # every publish), not each PR iteration.
        group: ${{ fromJSON(github.event_name == 'pull_request' && '["general","workspace","hosted","hosted-ui"]' || '["general","workspace","hosted","hosted-ui","stress"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-browser-${{ matrix.group }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      PI_WEB_BROWSER_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      # Match core verification's pinned protocol, including the bootstrap path.
      - name: Check protocol publication
        id: protocol
        run: node scripts/sync-protocol-dependency.mjs --probe
      - name: Check out protocol source for initial verification
        if: steps.protocol.outputs.published == 'false'
        uses: actions/checkout@v7
        with:
          repository: chengzhiyi/pi-extensions
          ref: e719070a1d407319841a9a23287e402265a63b8a
          path: .ci/pi-extensions
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        if: steps.protocol.outputs.published == 'false'
        with:
          package_json_file: .ci/pi-extensions/package.json
      - name: Build the protocol from the pinned source
        if: steps.protocol.outputs.published == 'false'
        working-directory: .ci/pi-extensions
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @chengzhiyi/pi-web-protocol build
      - name: Resolve the protocol dependency for verification
        run: node scripts/sync-protocol-dependency.mjs --source .ci/pi-extensions/packages/protocol
      # Normally ~20s; fail fast on a registry hang instead of holding the job.
      - run: npm ci
        timeout-minutes: 5
      - name: Fetch integrity-pinned published plugin fixtures
        timeout-minutes: 3
        run: node scripts/prepare-hosted-ci-fixtures.mjs
      # ubuntu-24.04 already has native browser libraries and the PTY compiler.
      # Tests use the default headless shell, not the unused full Chrome binary.
      # Do not run --with-deps: live browser checks fail if the image loses a lib.
      - name: Install only the lockfile-pinned headless browser (no apt)
        timeout-minutes: 2
        run: npx playwright install --only-shell chromium
      - name: Require the pinned browser and runner libraries (no apt fallback)
        timeout-minutes: 1
        run: node scripts/verify-ci-playwright.mjs
      - run: npm run build
      # Disjoint file groups in isolated runners, each retaining a single worker.
      - name: Run browser group once and retain its report
        id: browser
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: .ci/browser/report.json
        run: npx playwright test --config=playwright.ci.config.ts --reporter=line,json
      - name: Require clean hosted lifecycle or complete stress evidence
        if: always() && (matrix.group == 'hosted' || matrix.group == 'hosted-ui' || matrix.group == 'stress') && steps.browser.outcome != 'skipped' && steps.browser.outcome != 'cancelled'
        run: node scripts/verify-hosted-browser-results.mjs .ci/browser/report.json "${{ matrix.group }}"
      - name: Verify real public cross-version plugin update
        if: matrix.group == 'hosted'
        env:
          HOSTED_NPM_UPGRADE_FROM: '0.1.0'
        run: npx playwright test hosted-npm --reporter=line
      - name: Verify disabled telemetry in the exact package (no Sentry access)
        if: matrix.group == 'general'
        run: |
          mkdir -p .ci/release
          npm pack --ignore-scripts --json --pack-destination .ci/release > .ci/release/pack.json
          node scripts/verify-sentry-release.mjs --telemetry-disabled --pack-manifest .ci/release/pack.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-evidence-${{ matrix.group }}
          path: |
            .ci/browser
            test-results
          if-no-files-found: ignore

  # Keep the existing required check name; no failed/skipped/cancelled group may
  # turn green merely because an upstream job did not run.
  verify:
    if: always()
    needs: [changes, verify-core, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      protocol_published: ${{ needs.verify-core.outputs.protocol_published }}
    steps:
      - name: Require every verification group to succeed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          CORE_RESULT: ${{ needs.verify-core.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$CODE_CHANGED" = false ]; then echo "Docs-only pull request: suites skipped."; exit 0; fi
          test "$CORE_RESULT" = success
          test "$BROWSER_RESULT" = success

  platform-smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-smoke-${{ matrix.os }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      # These tests use only Node's built-ins and can run before npm ci.
      - run: node --experimental-strip-types --test test/npm-command.test.ts test/self-update.test.ts test/open-web-page.test.ts test/release-channels.test.ts test/release-plan.test.ts test/hosted-ownership.test.ts

  ownership-minimum:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      # The supported minimum must provide real crash-safe OS custody, not a
      # fallback to the abandoned O_EXCL/PID design. No npm/native addon needed.
      - run: node --experimental-strip-types --test test/hosted-ownership.test.ts

  publish:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/alpha') && needs.verify.outputs.protocol_published == 'true'
    needs: [verify, platform-smoke, ownership-minimum]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: pi-webapp-npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Never replace the verified source with a newer branch tip.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11
      - name: Resolve the published protocol dependency
        run: node scripts/sync-protocol-dependency.mjs
      - name: Fetch integrity-pinned published plugin fixtures
        timeout-minutes: 3
        run: node scripts/prepare-hosted-ci-fixtures.mjs
      - run: npm ci
        timeout-minutes: 5
      - name: Choose the next version and npm distribution tag
        run: node scripts/prepare-release.mjs
      - run: npm run check
      # The integration tests serve web/dist; this local build does not upload.
      - run: npm run build
      - run: npm test
      # Sentry reporting is disabled by default. Keep local private maps and
      # exact-package validation, but do not upload or require external ingestion.
      - name: Pack verified local artifacts without rebuilding
        run: |
          mkdir -p .ci/release
          npm pack --ignore-scripts --json --pack-destination .ci/release > .ci/release/pack.json
          npm run verify:package -- --pack-manifest .ci/release/pack.json
      # Use the preinstalled release browser without restoring Sentry access.
      - name: Verify the runner Chrome used by release probes
        timeout-minutes: 1
        run: node scripts/verify-ci-chrome.mjs
      - name: Verify packaged Node and browser telemetry stay disabled
        env:
          PI_WEB_TEST_CHROME: 'true'
        run: node scripts/verify-sentry-release.mjs --telemetry-disabled --pack-manifest .ci/release/pack.json
      # Version changes belong only to this verified artifact. Do not race branch
      # pushes or create version-only merge conflicts between alpha and main.
      - name: Publish the verified tarball without lifecycle rebuilds
        run: node scripts/publish-verified-release.mjs

name: Desktop packages (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PI_WEB_SENTRY_ENABLED: "false"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:desktop
      - run: npm run desktop:prepare
      - run: npm run desktop:package
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            desktop-release/*.dmg
            desktop-release/*.exe
            desktop-release/*.AppImage
            .desktop/runtime/build-info.json
          if-no-files-found: error
          retention-days: 7

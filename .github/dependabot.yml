version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: alpha
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Kept in step with Pi and the protocol release by hand and by scripts/sync-protocol-dependency.mjs.
      - dependency-name: "@chengzhiyi/pi-web-protocol"
      - dependency-name: "@earendil-works/*"
      # Electron majors change the desktop runtime and need a manual upgrade.
      - dependency-name: electron
        update-types: ["version-update:semver-major"]
      # Node typings track the engines minimum (>=22.19.0), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # undici 8 dispatchers reject the legacy handlers sent by Node's built-in fetch
      # (bundled undici 7), which bin/http-transport.mjs pairs them with. Upgrade
      # once the supported Node versions ship undici 8.
      - dependency-name: undici
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /docs
    target-branch: alpha
    schedule:
      interval: monthly
    commit-message:
      prefix: docs
      include: scope
    groups:
      docs-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: alpha
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
